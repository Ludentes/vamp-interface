data:
  train_bs: 1
  train_width: 512
  train_height: 512
  meta_paths:
    - "./data/probe_meta.json"
  sample_margin: 5

solver:
  gradient_accumulation_steps: 4
  mixed_precision: 'bf16'
  enable_xformers_memory_efficient_attention: False
  gradient_checkpointing: True
  max_train_steps: 10
  max_grad_norm: 1.0
  learning_rate: 1.0e-5
  scale_lr: False
  lr_warmup_steps: 1
  lr_scheduler: 'constant'
  use_8bit_adam: True
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay:  1.0e-2
  adam_epsilon: 1.0e-8

val:
  validation_steps: 1000

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:          0.00085
  beta_end:            0.012
  beta_schedule:       "scaled_linear"
  steps_offset:        1
  clip_sample:         false

base_model_path: './pretrained_weights/sd-image-variations-diffusers'
vae_model_path: './pretrained_weights/sd-vae-ft-mse'
image_encoder_path: './pretrained_weights/sd-image-variations-diffusers/image_encoder'
controlnet_openpose_path: ''
persona_weights_dir: '/home/newub/w/PersonaLive/pretrained_weights/personalive'

weight_dtype: 'bf16'
uncond_ratio: 0.1
noise_offset: 0.05
snr_gamma: 5.0
enable_zero_snr: True
pose_guider_pretrain: False

seed: 12580
resume_from_checkpoint: ''
checkpointing_steps: 100000
save_model_epoch_interval: 999
exp_name: 'stage1_probe'
output_dir: './exp_output'
